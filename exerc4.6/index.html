<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<!--Necessitamos de uma aplicação web que implemente uma classe, na linguagem PHP, para representar os elementos mais importantes na definição de um item de informática, a saber:

a) Nome do item;
b) Classificação (componente de hardware ou software). Use botões de rádio para indicar esta informação no formulário;
c) Preço de venda do item;
d) Método construtor da classe;
e) Método para calcular e exibir o desconto dado pela loja, de acordo com a seguinte condição:

se o item for hardware, o desconto fixo é de 5% sobre o valor de venda do produto;
se o item for software, o desconto é de 7% sobre o preço de venda do produto;
f) Método para exibir o preço final do item, após calculado seu desconto.

Criar um formulário, válido e correto, em HTML5, com as informações de cadastro dos dados do item. Em seguida, um script em PHP deve, utilizando a classe construída, criar um objeto item com as informações do formulário, mostrar o valor do desconto fornecido e o preço final de venda do item.

A definição da classe deve estar dentro de uma include em PHP.-->

<body>
    <h1>Cadastro de Itens de Informática</h1>

    <form action="main.php" method="post">
        <label for="nomeInfo">Insira o nome do item: </label>
        <input type="text" id="nomeInfo" name="nome" required><br><br>

        <p>Selecione a classificação do item</p>

        <table border="1">
            <td>
                <label for="classHard">
                    <input type="radio" id="classHard" name="classificacao" value="hardware" required>Hardware
                </label>
            </td>
            <td>
                <label for="classSoft">
                    <input type="radio" id="classSoft" name="classificacao" value="software" required>Software
                </label>
            </td>
        </table>

        <br><br>

        <label for="precoInfo">Insira o preço do item (R$): </label>
        <input type="number" id="precoInfo" name="preco" min="0" step="0.01" required>

        <br><br>

        <input type="submit" value="Cadastrar item">
    </form>

</body>

</html>
