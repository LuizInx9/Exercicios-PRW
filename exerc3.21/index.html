<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3.21</title>
</head>

<!--



Elabore um formulário HTML5 que permita ao usuário fornecer três notas de determinado aluno. Também, o formulário 
deve permitir que o usuário da aplicação calcule ou a média aritmética simples das três notas ou a média ponderada 
destas notas, por meio de botões de rádio. A seguir:

a) Criar um script em PHP que receba as três notas dos alunos;

b) O script em PHP deverá testar se o usuário quer calcular a média aritmética ou a média ponderada;

c) Se o script em PHP detectar que o usuário quer o cálculo da média aritmética simples, crie uma função de 
usuário para desenvolver esta operação;

d) Se o script detectar que o usuário quer o cálculo da média ponderada, faça o PHP realizar a tarefa por meio de
uma função de usuário. Use, para efeito de cálculo, os seguintes pesos de cada nota:

    Peso da primeira nota = 5;
    Peso da segunda nota = 3;
    Peso da terceira nota = 2.

Ao final da aplicação, o script em PHP deverá mostrar as três notas do aluno e o valor da respectiva média.

e) Todas as funções mencionadas acima devem estar dentro de uma include, em um arquivo externo ao arquivo 
principal do PHP.


-->


<body>

    <h1>Exercício 3.21</h1>

    <form action="media.php" method="post">
        <h2>Insira as três notas do aluno</h2>
        <label for="primeiraNota">Primeira nota: </label>
        <input type="number" id="primeiraNota" name="nota1" min="0" required><br><br>

        <label for="segundaNota">Segunda nota: </label>
        <input type="number" id="segundaNota" name="nota2" min="0" required><br><br>

        <label for="terceiraNota">Terceira nota: </label>
        <input type="number" id="terceiraNota" name="nota3" min="0" required><br><br>

        <!--MÉDIA-->

        <h2>Qual média será realizada?</h2>
        <label for="mediaSimples">
            <input type="radio" id="mediaSimples" name="media" value="mediaS" required>Média Simples
        </label><br>
        <label for="mediaPonderada">
            <input type="radio" id="mediaPonderada" name="media" value="mediaP">Media Ponderada
        </label>

        <br><br>

        <!--ENVIAR-->

        <input type="submit" value="Calcular média">

    </form>

</body>

</html>
