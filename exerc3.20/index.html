<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3.20</title>
</head>

<!--



Elabore um formulário HTML5 que permita ao usuário fornecer um valor numérico qualquer. Este valor representa 
uma temperatura qualquer na escala Celsius ou Fahrenheit. Em seguida, insira dois botões de rádio para que o 
usuário decida para qual escala a conversão será feita. A seguir:

a) Criar um script em PHP que irá receber o valor fornecido e irá descobrir qual escala de conversão será 
utilizada;

b) A conversão de temperatura da escala Celsius para Fahrenheit deverá ser feita por uma função de usuário 
específica. A fórmula de conversão, neste caso, é:

F = (C × 9/5) + 32

c) A conversão de temperatura da escala Fahrenheit para Celsius deverá ser feita por outra função de usuário. 
A fórmula de conversão é:

C = (F − 32) × 5/9

d) Todas as funções mencionadas acima devem estar dentro de uma include, em um arquivo externo ao arquivo 
principal do PHP.


-->

<body>
    <h1>Exercício 3.20</h1>

    <form action="calcula.php" method="post">
        <label for="grausValue">Valor a ser convertido (em graus):</label>
        <input type="number" id="grausValue" name="graus" required><br><br>

        <p>Para qual escala a conversão será feita?</p>

        <label for="celsius">Celsius</label>
        <input type="radio" id="celsius" name="conversao" value="celsius" required>

        <label for="fahrenheit">Fahrenheit</label>
        <input type="radio" id="fahrenheit" name="conversao" value="fahrenheit" required>


        <input type="submit" value="Converter">



    </form>

</body>

</html>
