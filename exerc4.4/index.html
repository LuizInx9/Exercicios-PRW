<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4.4</title>
</head>

<!--
Necessitamos de uma aplicação web que implemente uma classe, na linguagem PHP, para representar os elementos mais importantes na definição de um objeto livro, a saber:

a) Título do livro;
b) Autor do livro;
c) ISBN do livro;
d) Preço de venda do livro;
e) Método construtor da classe;
f) Método para aplicar um certo percentual de desconto sobre o preço de venda do livro;
g) Método para exibir todas as informações sobre o objeto livro cadastrado.

Criar um formulário, válido e correto, em HTML5 com as informações de cadastro dos dados do livro e o percentual de desconto fornecido. Em seguida, um script em PHP deve, utilizando a classe construída, criar um objeto livro com as informações do formulário, aplicar a taxa de desconto fornecida, alterando o preço original do livro e, ao final, exibir todas as informações do livro cadastrado.

A definição da classe deve estar dentro de uma include em PHP.
-->

<body>
    <h1>Cadastro de Livros</h1>

    <form action="main.php" method="post">

        <label for="tituloLivro">Insira o título do livro: </label>
        <input type="text" id="tituloLivro" name="titulo" required placeholder="Título do livro"><br><br>

        <label for="nomeAutor">Insira o nome do autor: </label>
        <input type="text" id="nomeAutor" name="autor" required placeholder="Nome do autor"><br><br>

        <label for="isbnLivro">Insira o código ISBN do livro: </label>
        <input type="text" id="isbnLivro" name="isbn" required placeholder="ISBN do livro"><br><br>

        <label for="precoLivro">Insira o preço do livro (R$): </label>
        <input type="number" id="precoLivro" name="preco" min="00.00" step="0.01" required placeholder="R$00.00"><br><br>

        <label for="descontoLivro">Insira o percentual de desconto sobre o preço do livro (%): </label>
        <input type="number" id="descontoLivro" name="desconto" required placeholder="Desconto do livro" min="0" max="100"><br><br>

        <input type="submit" value="Cadastrar livro"> 


        <!--Vai logo cara-->
    </form>
</body>
</html>
