<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de IMC</title>
</head>

<!--

O IMC (Índice de Massa Corporal) é um método usado para detectar casos de obesidade ou desnutrição,
principalmente em estudos que envolvem grandes populações. Sua fórmula de cálculo é:

IMC = massa da pessoa / (altura × altura)

onde a massa é medida em kg e a altura em metros.

Criar um formulário onde o usuário forneça seu peso e sua altura. Em seguida, utilize uma função para
calcular o IMC da pessoa. Esta função deve, então, retornar este valor para o script principal.

Em seguida, uma outra função deverá receber o IMC calculado pela primeira e mostrar o resultado,
baseando-se na tabela de classificação. Esta função deve mostrar, também, o valor do IMC.

Ambas as funções devem estar em uma include.

-->

<body>
    <h1>Cálculo de IMC</h1>

    <form action="calcula.php" method="post">
        <label for="peso">Peso (em kg):</label>
        <input type="number" id="peso" name="peso" min="0.1" step="0.1" required><br><br>

        <label for="altura">Altura (em metros):</label>
        <input type="number" id="altura" name="altura" min="0.1" step="0.01" required><br><br>

        <input type="submit" value="Calcular IMC">
    </form>

</body>

</html>
