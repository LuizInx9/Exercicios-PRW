<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3.6</title>
</head>
<body>
<!--

Elabore um script em PHP que receba, de um formulário, o nome e a idade de três pessoas
 quaisquer. O script em PHP deverá:

a) Armazenar estas idades em um vetor de índice associativo, usando o nome da pessoa como índice;

b) Mostrar, na página web, no formato tabular, os dados de cada pessoa;

c) Mostrar, na página web, o nome e a idade da pessoa mais nova cadastrada.

-->

    <h1>Exercício 3.6</h1>
    
    <form action="dados.php" method="post">
        <label for="nomeForm1">Nome da primeira pessoa: </label>
        <input type="text" id="nomeForm1" name="nome1" required><br><br>

        <label for="idadeForm1">Idade da primeira pessoa: </label>
        <input type="number" id="idadeForm1" name="idade1" min="0" max="150"><br><br>
        
        <label for="nomeForm2">Nome da segunda pessoa: </label>
        <input type="text" id="nomeForm2" name="nome2" required><br><br>

        <label for="idadeForm2">Idade da segunda pessoa: </label>
        <input type="number" id="idadeForm2" name="idade2" min="0" max="150"><br><br>
        
        <label for="nomeForm3">Nome da terceira pessoa: </label>
        <input type="text" id="nomeForm3" name="nome3" required><br><br>

        <label for="idadeForm3">Idade da terceira pessoa: </label>
        <input type="number" id="idadeForm3" name="idade3" min="0" max="150"><br><br>
        
        <input type="submit" value="Enviar dados">

    </form>

</body>
</html>
