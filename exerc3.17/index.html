<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3.17</title>
</head>

<!--



Elabore uma aplicação web destinada a auxiliar os vendedores de determinado empreendimento comercial de nossa 
cidade. Por meio de um formulário HTML5 válido e correto, permita que o usuário da aplicação forneça os seguintes 
dados em relação à venda:

    Valor inicial da venda efetuada pelo vendedor;
    Percentual de comissão do vendedor;
    Desconto de 5% concedido ao cliente, se o mesmo pagar com cartão de fidelidade.

Em seguida, um script em PHP deverá:

a) Calcular o valor da comissão do vendedor. Este cálculo deve ser feito por meio de uma função de usuário do PHP;

b) Calcular o valor do desconto fornecido ao cliente, por meio de uma função de usuário em PHP;

c) Calcular o valor final da venda, levando em consideração o desconto dado ao cliente. Esta tarefa deve ser 
executada por uma função de usuário em PHP;

d) Mostrar, na página web, por meio de uma função de usuário, as seguintes informações:

    O valor inicial da venda;
    O percentual de comissão do vendedor;
    O valor da comissão do vendedor;
    O valor do desconto dado ao cliente, caso tenha pago com cartão de fidelidade;
    O valor final da compra pago pelo cliente.



-->

<body>
    <h1>Exercício 3.17</h1>

    <h2>Finalização da venda</h2>

    <form action="dados.php" method="post">
        <label for="valorVenda">Insira o valor inicial da venda: </label>
        <input type="number" id="valorVenda" name="venda" min="0.01" step="0.01" required><br><br>

        <label for="valorComissao">Percentual de comissão do vendedor: </label>
        <input type="number" id="valorComissao" name="comissao" min="0" step="0.1" required><br>

        <p>Qual o método de pagamento utilizado?: </p>
        <table border="1" style="margin: 10px;">
            <td>
                <label for="dinheiro">Dinheiro</label>
                <input type="radio" id="dinheiro" name="metodo" value="dinheiro"><br>
            </td>

            <td>
                <label for="pix">Pix</label>
                <input type="radio" id="pix" name="metodo" value="pix"><br> 
            </td>

            <td>
                <label for="cartaoFidelidade">Cartão de Fidelidade (5% de desconto)</label>
                <input type="radio" id="cartaoFidelidade" name="metodo" value="cartao"><br>
            </td>
        </table>

        <input type="submit" value="Finalizar compra">
    </form>
</body>

</html>
